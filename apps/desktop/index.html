<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tauri + React + Typescript</title>
  </head>

  <body>
    <div id="root">
      <style>
        body { margin: 0; background-color: #f8fafc; }
        @media (prefers-color-scheme: dark) { body { background-color: #0f172a; } }
        .app-init-loader {
          height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          color: #64748b;
        }
        @media (prefers-color-scheme: dark) { .app-init-loader { color: #94a3b8; } }
        .app-init-spinner {
          width: 32px;
          height: 32px;
          border: 3px solid #cbd5e1;
          border-top-color: #3b82f6;
          border-radius: 50%;
          animation: appInitSpin 0.7s linear infinite;
          margin-bottom: 12px;
        }
        @media (prefers-color-scheme: dark) { .app-init-spinner { border-color: #334155; border-top-color: #3b82f6; } }
        .app-init-text { font-size: 13px; font-weight: 500; letter-spacing: 0.02em; }
        @keyframes appInitSpin { to { transform: rotate(360deg); } }
      </style>
      <div class="app-init-loader">
        <div class="app-init-spinner"></div>
        <div class="app-init-text">加载中...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
